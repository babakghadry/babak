<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آریودسک — موشن ۱۵ ثانیه‌ای</title>
<style>
  /* Vazirmatn: Arabic-script and Latin subsets merged into one family via unicode-range */
  @font-face { font-family: "Vazirmatn"; font-weight: 400; src: url(fonts/vazirmatn-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Vazirmatn"; font-weight: 500; src: url(fonts/vazirmatn-arabic-500-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Vazirmatn"; font-weight: 700; src: url(fonts/vazirmatn-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url(fonts/vazirmatn-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Vazirmatn"; font-weight: 400; src: url(fonts/vazirmatn-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-200B, U+200F-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: "Vazirmatn"; font-weight: 500; src: url(fonts/vazirmatn-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-200B, U+200F-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: "Vazirmatn"; font-weight: 700; src: url(fonts/vazirmatn-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-200B, U+200F-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url(fonts/vazirmatn-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-200B, U+200F-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; background: #04060D; color: #EEF3FB; font: 500 15px "Vazirmatn", sans-serif; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; }
  #bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); opacity: .6; }
  body.render #bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="bar">برای پخش کلیک کنید · ← → جابه‌جایی فریم</div>
<audio id="a" src="build/aryodesk.wav" preload="auto"></audio>
<script src="reel.js"></script>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const params = new URLSearchParams(location.search);
  const sample = 'آریودسک ۱۲۳ abc';
  const fontsReady = Promise.all([
    '400 20px Vazirmatn', '500 20px Vazirmatn', '700 20px Vazirmatn', '900 20px Vazirmatn',
    '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"',
  ].map((f) => document.fonts.load(f, sample))).then(() => document.fonts.ready);

  // Offline render hook used by render.mjs: frame index -> PNG (base64)
  window.renderFrame = async (i, opt) => {
    Reel.render(ctx, i / Reel.FPS, opt);
    return cv.toDataURL('image/png').split(',')[1];
  };
  window.reelReady = fontsReady.then(() => true);

  if (params.has('render')) {
    document.body.classList.add('render');
  } else {
    // real-time preview
    const audio = document.getElementById('a');
    let playing = false, t0 = 0, pos = 0;
    const now = () => (playing ? (performance.now() - t0) / 1000 : pos);
    const loop = () => {
      let t = now();
      if (t >= Reel.DUR) { t = Reel.DUR - 1e-3; playing = false; pos = 0; audio.pause(); }
      Reel.render(ctx, t, { subframes: 1, grain: true });
      requestAnimationFrame(loop);
    };
    const toggle = () => {
      if (playing) { pos = now(); playing = false; audio.pause(); }
      else { t0 = performance.now() - pos * 1000; playing = true; audio.currentTime = pos; audio.play().catch(() => {}); }
    };
    cv.addEventListener('click', toggle);
    addEventListener('keydown', (e) => {
      if (e.key === ' ') toggle();
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        pos = Math.min(Reel.DUR - 0.01, Math.max(0, now() + (e.key === 'ArrowRight' ? 1 : -1) / Reel.FPS * (e.shiftKey ? 30 : 1)));
        if (playing) { t0 = performance.now() - pos * 1000; audio.currentTime = pos; }
      }
    });
    fontsReady.then(loop);
  }
</script>
</body>
</html>
